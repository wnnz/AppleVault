name: Release Build (Windows & macOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      macos_arch:
        description: "macOS target architecture"
        required: true
        default: "universal"
        type: choice
        options:
          - universal
          - arm64
          - amd64
      publish_release:
        description: "Also create/update GitHub Release when triggered manually"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check Version & Release State
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_build: ${{ steps.meta.outputs.should_build }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release state
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release == true }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(python3 - <<'PY'
          import json, pathlib, re

          root = pathlib.Path(".")
          m = re.search(r'AppVersion\s*=\s*"([^"]+)"', (root / "src/backend/update.go").read_text(encoding="utf-8"))
          if not m:
              raise SystemExit("Failed to parse AppVersion from src/backend/update.go")
          update_ver = m.group(1)
          pkg_ver = json.loads((root / "src/frontend/package.json").read_text(encoding="utf-8"))["version"]
          wails_ver = json.loads((root / "wails.json").read_text(encoding="utf-8"))["info"]["productVersion"]
          if not (update_ver == pkg_ver == wails_ver):
              raise SystemExit(f"Version mismatch: update.go={update_ver}, package.json={pkg_ver}, wails.json={wails_ver}")
          print(update_ver)
          PY
          )"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=${INPUT_PUBLISH_RELEASE}" >> "$GITHUB_OUTPUT"
            echo "Manual trigger for ${TAG} (publish_release=${INPUT_PUBLISH_RELEASE})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          RELEASE_EXISTS=false
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [[ "$TAG_EXISTS" == "true" || "$RELEASE_EXISTS" == "true" ]]; then
            NOTES_SYNCED="unchanged"
            if [[ "$RELEASE_EXISTS" == "true" ]]; then
              NOTES_UPDATED_FILE="/tmp/release_notes_update.md"
              export VERSION TAG GH_REPO
              python3 - <<'PY' > "$NOTES_UPDATED_FILE"
          import os, pathlib, subprocess

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]
          short_ver = version[:-2] if version.endswith(".0") else version

          notes_path = None
          for cand in (pathlib.Path(f"docs/RELEASE_NOTES_v{version}.md"), pathlib.Path(f"docs/RELEASE_NOTES_v{short_ver}.md")):
              if cand.is_file():
                  notes_path = cand
                  break

          if notes_path is None:
              raise SystemExit(0)

          body = notes_path.read_text(encoding="utf-8").strip()
          tags = subprocess.check_output(["git", "tag", "--list", "v*", "--merged", "HEAD", "--sort=-version:refname"], text=True).splitlines()
          prev_tag = next((t for t in tags if t and t != tag), "")
          if prev_tag and "/compare/" not in body:
              body += f"\n\n---\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}"
          print(body)
          PY
              if [[ -s "$NOTES_UPDATED_FILE" ]]; then
                CURRENT_BODY="$(gh release view "${TAG}" --json body --jq .body || true)"
                if python3 - "$CURRENT_BODY" "$NOTES_UPDATED_FILE" <<'PY'
          import pathlib, sys
          current = sys.argv[1].replace("\r\n", "\n").strip()
          desired = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").replace("\r\n", "\n").strip()
          raise SystemExit(0 if current != desired else 1)
          PY
                then
                  gh release edit "${TAG}" --title "果仓助手 (AppleVault) ${TAG}" --notes-file "$NOTES_UPDATED_FILE"
                  NOTES_SYNCED="updated"
                fi
              fi
            fi

            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 已跳过自动编译构建 (${TAG})
          - 检测到版本 \`${TAG}\` 对应的 Git 标签或 GitHub Release 已存在（tag=${TAG_EXISTS}, release=${RELEASE_EXISTS}），为避免重复耗时构建已跳过编译步骤。
          - Release 更新日志状态：**${NOTES_SYNCED}**。
          - 如需发布新版本，请先运行 \`scripts/set-version.ps1 -Version x.y.z\` 升级版本号后再合入 \`main\`。
          EOF
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 准备自动构建并发布 ${TAG}
          - 检测到新版本 \`${TAG}\` 合入 \`main\`，即将并行构建 Windows (amd64) 与 macOS (universal) 产物并创建 Release。
          EOF
          fi

  package-windows:
    name: Windows (amd64)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Install, test, and build frontend
        working-directory: src/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build

      - name: Run backend tests
        run: go test -count=1 ./src/backend/...

      - name: Build and package Windows release zip
        shell: pwsh
        run: ./scripts/package_windows.ps1 -SkipFrontend

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleVault-windows-amd64
          path: build/release/AppleVault-*-windows-amd64.zip*
          if-no-files-found: error

  package-macos:
    name: macOS (${{ inputs.macos_arch || 'universal' }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install, test, and build frontend
        working-directory: src/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build

      - name: Run backend tests
        run: go test -count=1 ./src/backend/...

      - name: Build and package macOS app
        run: bash ./scripts/build_macos.sh --skip-frontend --arch "${{ inputs.macos_arch || 'universal' }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleVault-macos
          path: build/release/AppleVault-*-macos-*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (${{ needs.prepare.outputs.tag }})
    needs:
      - prepare
      - package-windows
      - package-macos
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: cat *.sha256 | tr -d '\r' | sort -k2 > SHA256SUMS.txt

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]
          short_ver = version[:-2] if version.endswith(".0") else version

          notes_path = None
          for cand in (pathlib.Path(f"docs/RELEASE_NOTES_v{version}.md"), pathlib.Path(f"docs/RELEASE_NOTES_v{short_ver}.md")):
              if cand.is_file():
                  notes_path = cand
                  break

          tags = subprocess.check_output(["git", "tag", "--list", "v*", "--merged", "HEAD", "--sort=-version:refname"], text=True).splitlines()
          prev_tag = next((t for t in tags if t and t != tag), "")

          if notes_path is not None:
              body = notes_path.read_text(encoding="utf-8").strip()
              if prev_tag and "/compare/" not in body:
                  body += f"\n\n---\n\n**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}"
          else:
              log_range = f"{prev_tag}..HEAD" if prev_tag else "HEAD"
              commits = subprocess.check_output(
                  ["git", "log", log_range, "--no-merges", "--pretty=format:- %s (%h)"],
                  text=True,
              ).strip()
              parts = [f"# 果仓助手 (AppleVault) {tag} 更新说明", ""]
              if commits:
                  parts.append("## 更新内容")
                  parts.append(commits)
              else:
                  parts.append("常规构建与版本发布。")
              if prev_tag:
                  parts.append("")
                  parts.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")
              body = "\n".join(parts)

          pathlib.Path("dist/RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 果仓助手 (AppleVault) ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
